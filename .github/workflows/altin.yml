name: altin-bildirim

on:
  schedule:
    - cron: "*/10 * * * 0-5"   # Pazar-Cuma, 10 dk'da bir (Cumartesi yok; kapali saatleri betik atlar)
  workflow_dispatch:
    inputs:
      test:
        description: "Deneme bildirimi gonder (durumu degistirmez)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: altin
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fiyati kontrol et
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '' }}
        run: python3 altin.py
      - name: Durumu kaydet
        run: |
          if [ -n "$(git status --porcelain durum.json)" ]; then
            git config user.name "altin-bot"
            git config user.email "altin-bot@users.noreply.github.com"
            git add durum.json
            git commit -m "durum guncellendi"
            git push
          fi
